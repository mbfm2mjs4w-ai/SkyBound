<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Skybound Feather Rush</title>
<style>:root{color-scheme:dark;--bg:#070b24}body{background:var(--bg)}</style>
<div id="app"></div>
<script>"use strict";(()=>{var Di=`:root{
  --ui-scale:1;--accent:#7affc1;--accent2:#5ad1ff;--gold:#ffd34a;--danger:#ff6a7a;--ink:#10173a;
  --glass:rgba(16,24,68,.52);--glass-hi:rgba(255,255,255,.14);--stroke:rgba(255,255,255,.28);
  --font:'Baloo 2','Fredoka','Trebuchet MS','Segoe UI',system-ui,-apple-system,sans-serif;
  --r:18px;--common:#b8c4d8;--rare:#5ab8ff;--epic:#c27aff;--legendary:#ffc24a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:calc(16px*var(--ui-scale))}
html,body{margin:0;height:100%;background:#070b24;overflow:hidden;font-family:var(--font);color:#fff;-webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
#app{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 30%,#1b2a6a,#070b24)}
#game-canvas{display:block;image-rendering:auto;touch-action:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui .screen,#ui .hud,#ui .modal-back,#ui .toasts{pointer-events:none}
.screen>*,.hud button,.modal,.toast,.pchip{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ico{display:inline-flex;vertical-align:middle}
.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(14px) saturate(150%);-webkit-backdrop-filter:blur(14px) saturate(150%);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.2)}
.glass-btn{width:2.6rem;height:2.6rem;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(10px);box-shadow:0 4px 14px rgba(0,0,0,.25);transition:transform .12s,background .12s}
.glass-btn:hover{background:rgba(255,255,255,.2)}.glass-btn:active{transform:scale(.92)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.4rem;border-radius:999px;font-weight:800;font-size:1.05rem;letter-spacing:.02em;color:#08203a;background:linear-gradient(180deg,#b8ffe0,var(--accent) 55%,#3fd89a);border:2px solid rgba(255,255,255,.7);box-shadow:0 6px 0 #1f9c6c,0 10px 24px rgba(0,0,0,.35);text-shadow:0 1px 0 rgba(255,255,255,.5);transition:transform .1s,box-shadow .1s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1f9c6c,0 4px 12px rgba(0,0,0,.35)}
.btn.gold{background:linear-gradient(180deg,#fff0a8,var(--gold) 55%,#f0a21a);box-shadow:0 6px 0 #b8740a,0 10px 24px rgba(0,0,0,.35)}.btn.gold:active{box-shadow:0 2px 0 #b8740a}
.btn.blue{background:linear-gradient(180deg,#c9f0ff,var(--accent2) 55%,#2a8fe0);box-shadow:0 6px 0 #1a5fa8,0 10px 24px rgba(0,0,0,.35);color:#05213f}.btn.blue:active{box-shadow:0 2px 0 #1a5fa8}
.btn.ghost{background:var(--glass-hi);color:#fff;border:1px solid var(--stroke);box-shadow:0 4px 16px rgba(0,0,0,.25);text-shadow:none;backdrop-filter:blur(10px)}.btn.ghost:active{box-shadow:none}
.btn.danger{background:linear-gradient(180deg,#ffc1c8,var(--danger));box-shadow:0 6px 0 #b0303f,0 10px 24px rgba(0,0,0,.35);color:#3a0510}
.btn.big{font-size:1.5rem;padding:.9rem 2.6rem}.btn.small{font-size:.85rem;padding:.4rem .9rem;box-shadow:0 3px 0 #1f9c6c}
.btn[disabled],.btn.disabled{filter:grayscale(.85) brightness(.8);cursor:not-allowed;pointer-events:none;opacity:.75}
/* screens */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(.8rem,env(safe-area-inset-top)) max(.9rem,env(safe-area-inset-right)) max(.8rem,env(safe-area-inset-bottom)) max(.9rem,env(safe-area-inset-left));animation:scrIn .35s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.screen.out{animation:scrOut .2s forwards}
@keyframes scrIn{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@keyframes scrOut{to{opacity:0;transform:translateY(-8px)}}
.topbar{display:flex;align-items:center;gap:.6rem;flex:0 0 auto}
.topbar h2{margin:0;font-size:1.6rem;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.45);flex:1}
.topbar .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .75rem;border-radius:999px;background:rgba(0,0,0,.25);font-weight:800}
.chip.dim{opacity:.85;font-weight:700}
.wallet{display:flex;gap:.4rem}.wallet .chip{font-size:1.05rem;border:1px solid var(--stroke);background:var(--glass)}
.content{flex:1;min-height:0;overflow:auto;padding:.7rem .2rem 1rem;-webkit-overflow-scrolling:touch;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.35) transparent}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin:.2rem 0 .4rem}
.tab{padding:.45rem 1rem;border-radius:999px;font-weight:800;background:var(--glass);border:1px solid var(--stroke);transition:background .15s}
.tab.on{background:linear-gradient(180deg,var(--accent),#3fd89a);color:#08203a;border-color:#fff}
.grid{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(16rem,1fr))}
.card{position:relative;padding:.7rem;border-radius:var(--r);background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:.35rem;transition:transform .15s,border-color .15s,box-shadow .15s;text-align:left;overflow:hidden}
button.card:hover,.card.click:hover{transform:translateY(-3px);border-color:#fff;box-shadow:0 10px 26px rgba(0,0,0,.35)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 10px 26px rgba(0,0,0,.35)}
.card h3{margin:0;font-size:1.1rem}.card p{margin:0;font-size:.85rem;opacity:.85;line-height:1.25}.card canvas{width:100%;display:block;border-radius:12px;background:rgba(0,0,0,.2)}
.lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;background:rgba(6,10,36,.62);backdrop-filter:blur(2px);font-weight:800;text-align:center;padding:.6rem;font-size:.9rem}
.tag{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.18);text-transform:uppercase;letter-spacing:.04em}
.tag.common{background:var(--common);color:#12203a}.tag.rare{background:var(--rare);color:#02203a}.tag.epic{background:var(--epic);color:#2a0a4a}.tag.legendary{background:var(--legendary);color:#4a2a00}.tag.secret{background:#ff4ad0;color:#fff}.tag.ok{background:var(--accent);color:#08203a}
.price{display:inline-flex;align-items:center;gap:.3rem;font-weight:800}
.bar{height:.7rem;border-radius:999px;background:rgba(0,0,0,.35);overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:999px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;gap:.6rem}.row.sb{justify-content:space-between}.col{display:flex;flex-direction:column;gap:.5rem}.grow{flex:1}.wrap{flex-wrap:wrap}.center{text-align:center}.muted{opacity:.7}
h1,h2,h3{font-weight:800}
/* main menu */
.menu-body{flex:1;min-height:0;display:flex;flex-direction:row;align-items:stretch;gap:1rem}
.menu .left{flex:0 0 min(26rem,46%);display:flex;flex-direction:column;justify-content:center;gap:.9rem}
.logo{line-height:.95;margin-bottom:.2rem}
.logo b{display:block;font-size:clamp(2.2rem,6.2vw,3.6rem);font-weight:800;letter-spacing:.03em;background:linear-gradient(180deg,#fff 10%,#ffe27a 55%,#ff9a4a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(120,50,10,.55)) drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.logo span{display:block;font-size:clamp(1.1rem,3vw,1.7rem);font-weight:800;letter-spacing:.18em;color:#bfe9ff;text-shadow:0 2px 8px rgba(0,0,0,.6);margin-top:.2rem}
.logo small{display:block;margin-top:.45rem;font-size:.78rem;letter-spacing:.14em;opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem}
.tile{display:flex;flex-direction:column;align-items:center;gap:.25rem;padding:.65rem .3rem;border-radius:16px;background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(12px);font-weight:800;font-size:.8rem;text-align:center;transition:transform .12s,background .12s;position:relative;line-height:1.05}
.tile:hover{background:rgba(255,255,255,.22);transform:translateY(-2px)}.tile:active{transform:scale(.95)}
.tile .ico svg{width:1.6rem;height:1.6rem}
.tile .dot{position:absolute;top:.35rem;right:.4rem;width:.75rem;height:.75rem;border-radius:50%;background:var(--danger);border:2px solid #fff;animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
.lvl{display:flex;align-items:center;gap:.6rem;padding:.35rem .8rem .35rem .4rem;border-radius:999px;font-weight:800}
.lvl .badge{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#ffe27a,#ff9a4a);color:#4a2000;border:2px solid #fff;font-size:1rem}
.lvl .bar{width:7rem;height:.55rem}
@media (max-aspect-ratio:1/1),(max-width:720px){
  .menu-body{flex-direction:column;justify-content:flex-end}.menu .left{flex:0 0 auto;justify-content:flex-end}.menu-grid{grid-template-columns:repeat(5,1fr)}.tile{font-size:.68rem;padding:.5rem .1rem}.logo{text-align:center}
}
@media (max-width:520px){.menu-grid{grid-template-columns:repeat(4,1fr)}}
/* mode cards */
.mode{padding:.8rem;min-height:8rem}.mode .em{font-size:1.9rem;line-height:1}.mode .row{align-items:flex-start}
.badge-best{font-size:.78rem;opacity:.9}
/* hud */
.hud{position:absolute;inset:0;display:block;font-weight:800}
.hud-top{position:absolute;top:max(.6rem,env(safe-area-inset-top));left:max(.7rem,env(safe-area-inset-left));right:max(.7rem,env(safe-area-inset-right));display:flex;justify-content:space-between;align-items:flex-start;gap:.5rem}
.hud-left{display:flex;flex-direction:column;gap:.15rem;padding:.35rem .5rem;min-width:5.5rem}.hud-left .chip{background:none;padding:.05rem .2rem;font-size:1.05rem}
.hud-center{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.25rem;width:min(22rem,50%);text-align:center}
.hud-score{font-size:clamp(3rem,9vh,4.8rem);font-weight:800;line-height:1;text-shadow:0 4px 0 rgba(10,20,80,.55),0 0 24px rgba(0,0,0,.45);-webkit-text-stroke:2px rgba(10,20,80,.55);paint-order:stroke fill}
.hud-score.pop{animation:pop .25s}
@keyframes pop{40%{transform:scale(1.3)}}
.hud-combo{font-size:1.1rem;color:var(--gold);text-shadow:0 2px 6px rgba(0,0,0,.6);opacity:0;transition:opacity .2s}.hud-combo.on{opacity:1}.hud-combo.pop{animation:pop .3s}
.hud-sub{font-size:.8rem;opacity:.85;letter-spacing:.08em;text-shadow:0 1px 4px rgba(0,0,0,.7);text-transform:uppercase}
.hud-progress{width:100%;height:.5rem;border-radius:99px;background:rgba(0,0,0,.4);overflow:hidden;border:1px solid rgba(255,255,255,.35)}.hud-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5ad1ff,#7affc1);transition:width .25s}.hud-progress[data-kind=boss] i{background:linear-gradient(90deg,#ff6a7a,#ffb347)}.hud-progress[data-kind=time] i{background:linear-gradient(90deg,#ffd34a,#ff6a7a)}
.hud-powers{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center}
.pchip{position:relative;display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .6rem;border-radius:99px;font-size:.75rem;background:rgba(10,14,50,.6);border:1px solid var(--c);overflow:hidden;pointer-events:none}.pchip .pdot{width:.55rem;height:.55rem;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}.pchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--c)}
.hud-right{display:flex;flex-direction:column;align-items:flex-end;gap:.4rem}
.hud-lives{display:flex;gap:.1rem;color:#ff4a6a}.heart{opacity:.3;filter:grayscale(.6)}.heart.on{opacity:1;filter:drop-shadow(0 0 6px rgba(255,74,106,.8))}
.hud-timer{position:absolute;left:50%;top:7.6rem;transform:translateX(-50%);font-size:2rem;text-shadow:0 2px 10px rgba(0,0,0,.6)}.hud-timer.low{color:#ff6a7a;animation:pulse .6s infinite}
.hud-fps{position:absolute;left:.8rem;bottom:.5rem;font-size:.75rem;opacity:.8;text-shadow:0 1px 3px #000}
.hud-boss{position:absolute;left:50%;bottom:1.2rem;transform:translateX(-50%) translateY(20px);width:min(26rem,80%);opacity:0;transition:.4s;text-align:center}.hud-boss.on{opacity:1;transform:translateX(-50%)}
.boss-name{font-size:1.1rem;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 2px 8px #000;margin-bottom:.2rem}.boss-bar{height:.8rem;border-radius:99px;background:rgba(0,0,0,.55);border:2px solid #fff;overflow:hidden}.boss-bar i{display:block;height:100%;background:linear-gradient(90deg,#ff3a5a,#ffb347);transition:width .35s}
.hud-banner{position:absolute;left:0;right:0;top:32%;display:flex;justify-content:center;pointer-events:none}
.bn{display:flex;flex-direction:column;align-items:center;gap:.1rem;text-align:center;padding:0 1rem;text-shadow:0 4px 16px rgba(0,0,0,.65)}.bn b{font-size:clamp(2rem,6vw,3.4rem);letter-spacing:.06em;-webkit-text-stroke:2px rgba(10,20,80,.5);paint-order:stroke fill}.bn small{font-size:1.05rem;opacity:.95;letter-spacing:.06em}
.bn.milestone b,.bn.record b{color:var(--gold)}.bn.boss b{color:#ff6a7a;font-size:clamp(2.2rem,7vw,4rem)}.bn.power b{font-size:clamp(1.4rem,4vw,2rem);color:var(--accent)}.bn.world b{color:#bfe9ff}.bn.count b{font-size:5rem}
.hud-banner.show .bn{animation:bn 2.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes bn{0%{opacity:0;transform:scale(.6) translateY(20px)}12%{opacity:1;transform:scale(1.08)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.hud-ready{position:absolute;left:50%;top:56%;transform:translate(-50%,0);opacity:0;pointer-events:none;transition:opacity .25s}.hud-ready.on{opacity:1}
.tap{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center;max-width:24rem;text-shadow:0 3px 12px rgba(0,0,0,.7)}.tap b{font-size:1.7rem;letter-spacing:.08em;animation:bob 1.2s ease-in-out infinite}.tap small{font-size:.9rem;opacity:.95;background:rgba(0,0,0,.3);padding:.3rem .8rem;border-radius:99px}
.tap-ring{width:3.2rem;height:3.2rem;border-radius:50%;border:3px solid #fff;animation:ring 1.3s infinite}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes ring{0%{transform:scale(.6);opacity:1}100%{transform:scale(1.6);opacity:0}}
/* modal / overlays */
.modal-back{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,8,30,.55);backdrop-filter:blur(6px);animation:fade .2s;pointer-events:auto;padding:1rem;z-index:20}
@keyframes fade{from{opacity:0}}
.modal{max-width:min(34rem,94vw);max-height:90%;overflow:auto;padding:1.2rem 1.4rem;display:flex;flex-direction:column;gap:.8rem;animation:rise .28s cubic-bezier(.2,.9,.3,1.2);background:rgba(16,22,70,.78)}
@keyframes rise{from{transform:translateY(24px) scale(.94);opacity:0}}
.modal h2{margin:0;font-size:1.5rem}.modal p{margin:0;opacity:.9}
.toasts{position:absolute;bottom:.9rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column-reverse;gap:.5rem;align-items:center;z-index:30;width:min(26rem,92vw)}
.toast{width:100%;padding:.6rem 1rem;border-radius:16px;display:flex;align-items:center;gap:.7rem;animation:toastIn .35s cubic-bezier(.2,.9,.3,1.2);font-weight:700;background:rgba(16,22,70,.85);border:1px solid var(--stroke);backdrop-filter:blur(10px)}.toast.ok{border-color:var(--accent)}.toast.err{border-color:var(--danger)}.toast.ach{border-color:var(--legendary);background:linear-gradient(90deg,rgba(80,50,0,.85),rgba(16,22,70,.85))}
@keyframes toastIn{from{transform:translateY(-30px) scale(.9);opacity:0}}
/* game over */
.over{align-items:center;justify-content:center;gap:.8rem;background:radial-gradient(circle at 50% 40%,rgba(10,16,60,.35),rgba(4,6,24,.7))}
.over-card{width:min(32rem,94vw);max-height:96%;overflow:auto;padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:.7rem;text-align:center;touch-action:pan-y}
.over-card .actions{position:sticky;bottom:-1.1rem;margin:0 -1.3rem -1.1rem;padding:.8rem 1.3rem 1.1rem;background:linear-gradient(to bottom,rgba(10,18,56,0),rgba(10,18,56,.94) 40%);z-index:2}
.over-card h1{margin:0;font-size:2rem;letter-spacing:.06em}
.big-score{font-size:4.2rem;font-weight:800;line-height:1;text-shadow:0 4px 0 rgba(10,20,80,.5)}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}.stat{background:rgba(0,0,0,.25);border-radius:14px;padding:.4rem .2rem}.stat b{display:block;font-size:1.3rem}.stat small{opacity:.75;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.newrec{display:inline-block;padding:.2rem .9rem;border-radius:99px;font-weight:800;background:linear-gradient(90deg,#ffd34a,#ff9a4a);color:#4a2000;animation:pulse 1s infinite}
.list{display:flex;flex-direction:column;gap:.4rem;text-align:left}.list .item{display:flex;align-items:center;gap:.6rem;padding:.45rem .7rem;border-radius:12px;background:rgba(0,0,0,.25)}
.stars{display:flex;justify-content:center;gap:.3rem;color:#ffd34a}.stars .off{color:#fff;opacity:.25}.stars .ico svg{width:2.4rem;height:2.4rem}.stars .ico{animation:starIn .5s both}@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.reveal canvas{width:14rem;height:11rem}
/* misc */
.field{display:flex;flex-direction:column;gap:.25rem}.field label{font-size:.85rem;opacity:.85;font-weight:700}
input[type=text],input[type=email],input[type=password],select{font:inherit;padding:.5rem .8rem;border-radius:12px;border:1px solid var(--stroke);background:rgba(0,0,0,.3);color:#fff;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%;accent-color:var(--accent)}
.switch{position:relative;width:3rem;height:1.7rem;border-radius:99px;background:rgba(255,255,255,.2);border:1px solid var(--stroke);transition:.2s;flex:0 0 auto}.switch::after{content:'';position:absolute;top:.15rem;left:.15rem;width:1.2rem;height:1.2rem;border-radius:50%;background:#fff;transition:.2s}.switch.on{background:var(--accent)}.switch.on::after{left:1.45rem}
.section{padding:.8rem 1rem;display:flex;flex-direction:column;gap:.7rem;margin-bottom:.8rem}.section h3{margin:0;font-size:1.05rem;color:var(--accent)}
.set-row{display:flex;align-items:center;gap:.8rem;justify-content:space-between}.set-row>span:first-child{flex:1}
.notice{padding:.7rem 1rem;border-radius:14px;background:rgba(255,200,80,.16);border:1px solid rgba(255,200,80,.5);display:flex;gap:.6rem;align-items:flex-start;line-height:1.3}
.preview{position:relative;touch-action:none;cursor:grab}.preview canvas{width:100%;display:block;border-radius:14px;background:radial-gradient(circle,rgba(255,255,255,.18),rgba(0,0,0,.25))}.preview .hint{position:absolute;left:0;right:0;bottom:.3rem;text-align:center;font-size:.7rem;opacity:.7}
.table{width:100%;border-collapse:collapse}.table td,.table th{padding:.45rem .6rem;text-align:left;border-bottom:1px solid rgba(255,255,255,.12)}.table th{font-size:.75rem;opacity:.7;text-transform:uppercase}
.lvlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(8rem,1fr));gap:.6rem}.lv{position:relative;padding:.6rem;text-align:center;border-radius:14px;background:var(--glass);border:1px solid var(--stroke)}.lv.locked{opacity:.5}
.fade-in{animation:scrIn .3s}
